# Optional: the chat UI as its own tenant-owned catalog app ("RAG Chat"),
# instead of launching the generic Streamlit app with a Git URL.
#
# Authored from the create-app skill's Streamlit template. It has NOT been
# uploaded or launched. To install it, upload this file as config_text with
# ui/app.py as the execution file main.py (upload_app MCP tool), then launch
# with launch_app_instance. Launch-form fields reach the process as
# <SECTION>_<NAME> environment variables, so "Middleware URL" arrives as
# ARGS_API_URL, which ui/app.py reads.
id: rag-chat
name: "RAG Chat"
version: "1.0.0"
provider: "replaced-by-uploader"
description: "Chat UI over the indexed documentation. Calls the RAG middleware and shows cited sources."

task {
  container { image: "python:3.11-slim" }
  script {
    run_command: "streamlit run main.py --server.port 8080 --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false"
    requirements { pip: ["streamlit>=1.37", "httpx>=0.27", "clearml"] }
  }
}

controller {
  endpoint { port: 8080, type: http, liveliness_url: "http://localhost:8080/_stcore/health" }
}

wizard {
  entries: [
    {
      name: queue
      title: "Compute Resource (Queue)"
      info: "The compute resource that runs the UI. A CPU resource is enough."
      type: dropdown
      autocomplete: true
      choices {
        source: queue
        value_field: name
        display_field: [display_name, name]
      }
    },
    {
      name: project
      title: "Project"
      info: "The project in which the instance is created. Access to the UI follows the project's access rights."
      type: dropdown
      autocomplete: true
      required: true
      choices {
        source: project
        value_field: name
        display_field: name
      }
      target: {
        field: hyperparams
        section: Args
        name: project
      }
    },
    {
      name: api_url
      title: "Middleware URL"
      info: "Base URL of the RAG middleware instance, for example its application gateway route."
      type: string
      required: true
      target: {
        field: hyperparams
        section: Args
        name: api_url
      }
    }
  ]
}

dashboard {
  lines: [
    {
      contents: [
        {
          type: html
          title: "RAG Chat"
          text: """<a href="${hyperparams.dashboard.browser_endpoint.value}">${hyperparams.dashboard.browser_endpoint.value}</a>"""
        },
        { type: log, title: "Log" }
      ]
    }
  ]
}
